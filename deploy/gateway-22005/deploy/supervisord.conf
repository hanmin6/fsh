[supervisord]
nodaemon=true
pidfile=/tmp/gateway-runtime/supervisord.pid
logfile=/srv/gateway/logs/supervisor.log
logfile_maxbytes=5MB
logfile_backups=3
[unix_http_server]
file=/tmp/gateway-runtime/supervisor.sock
chmod=0700
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///tmp/gateway-runtime/supervisor.sock
[program:xvfb]
command=Xvfb :99 -screen 0 1440x1000x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/srv/gateway/logs/xvfb.log
stderr_logfile=/srv/gateway/logs/xvfb.error.log
[program:desktop]
command=fluxbox
priority=20
autorestart=true
stdout_logfile=/srv/gateway/logs/desktop.log
stderr_logfile=/srv/gateway/logs/desktop.error.log
[program:vnc]
command=x11vnc -display :99 -forever -shared -localhost -rfbport 5901 -rfbauth /srv/gateway/private/vnc.pass
priority=30
autorestart=true
stdout_logfile=/srv/gateway/logs/vnc.log
stderr_logfile=/srv/gateway/logs/vnc.error.log
[program:novnc]
command=websockify --web=/usr/share/novnc 127.0.0.1:6080 127.0.0.1:5901
priority=40
autorestart=true
stdout_logfile=/srv/gateway/logs/novnc.log
stderr_logfile=/srv/gateway/logs/novnc.error.log
[program:alibaba]
command=python /srv/gateway/scripts/run_windows_gateway.py alibaba --config /srv/gateway/private/channels-linux.json
priority=50
autorestart=true
startsecs=10
startretries=20
stdout_logfile=/srv/gateway/logs/alibaba.log
stderr_logfile=/srv/gateway/logs/alibaba.error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
[program:mic]
command=python /srv/gateway/scripts/run_windows_gateway.py mic --config /srv/gateway/private/channels-linux.json
priority=50
autorestart=true
startsecs=10
startretries=20
stdout_logfile=/srv/gateway/logs/mic.log
stderr_logfile=/srv/gateway/logs/mic.error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
[program:bridge]
command=python /srv/gateway/scripts/run_windows_gateway.py bridge --config /srv/gateway/private/channels-linux.json
priority=60
autorestart=true
startsecs=10
startretries=20
stdout_logfile=/srv/gateway/logs/bridge.log
stderr_logfile=/srv/gateway/logs/bridge.error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
