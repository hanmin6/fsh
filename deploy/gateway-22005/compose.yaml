services:
  gateway:
    image: fsh-gateway:20261008
    build:
      context: deploy
      network: host
    container_name: fusanhe-channel-gateway
    network_mode: host
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 4g
    cpus: 2
    shm_size: 1g
    volumes:
      - .:/srv/gateway
    environment:
      DISPLAY: ":99"
      FUSANHE_OUTBOUND_PAUSED: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import subprocess,urllib.request; r=subprocess.run(['supervisorctl','status'],capture_output=True,text=True); assert r.returncode==0 and r.stdout.count('RUNNING')==7; assert urllib.request.urlopen('http://127.0.0.1:8787/health/live',timeout=5).status==200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
