name: fusanhe-crm-private-access

services:
  caddy:
    image: caddy:2.10-alpine
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      CRM_LAN_IP: ${CRM_LAN_IP:-192.168.0.13}
      CRM_LAN_CIDR: ${CRM_LAN_CIDR:-192.168.0.0/23}
      CRM_ROUTING_PEER_IP: ${CRM_ROUTING_PEER_IP:-172.30.93.2}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  netbird:
    image: ${NETBIRD_IMAGE:-netbirdio/netbird:0.81.3-rootless@sha256:6ecdc46761656f2e724dd3daffed6bf48c2ea55fe5446c940e81295af188b3f9}
    profiles: [vpn]
    hostname: fsh-crm-gz
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    environment:
      NB_USE_NETSTACK_MODE: "true"
      NB_ENABLE_NETSTACK_LOCAL_FORWARDING: "false"
      NB_DISABLE_DNS: "true"
      NB_NETSTACK_SKIP_PROXY: "true"
    volumes:
      - netbird-state:/var/lib/netbird
    tmpfs:
      - /tmp:mode=1777
    networks:
      vpn-egress:
        ipv4_address: ${CRM_ROUTING_PEER_IP:-172.30.93.2}
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "2"

networks:
  vpn-egress:
    ipam:
      config:
        - subnet: 172.30.93.0/29

volumes:
  caddy-data:
  caddy-config:
  netbird-state:
