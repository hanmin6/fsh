name: fusanhe-crm

x-ai-gateway-environment: &ai-gateway-environment
  FUSANHE_CREATIVE_MAX_DAILY_PLANS: ${FUSANHE_CREATIVE_MAX_DAILY_PLANS:-20}
  FUSANHE_TEXT_ENABLED: ${FUSANHE_TEXT_ENABLED:-false}
  FUSANHE_TEXT_API_BASE_URL: ${FUSANHE_TEXT_API_BASE_URL:-https://gw.apimonth.com/v1}
  FUSANHE_TEXT_API_KEY: ${FUSANHE_TEXT_API_KEY:-}
  FUSANHE_TEXT_MODEL_GPT: ${FUSANHE_TEXT_MODEL_GPT:-gpt-6.1-sol}
  FUSANHE_TEXT_MODEL_GROK: ${FUSANHE_TEXT_MODEL_GROK:-grok-4.7}
  FUSANHE_TEXT_MODEL_GEMINI: ${FUSANHE_TEXT_MODEL_GEMINI:-gemini-3.8-flash}
  FUSANHE_TEXT_DEFAULT_MODEL: ${FUSANHE_TEXT_DEFAULT_MODEL:-gpt}
  FUSANHE_TEXT_TIMEOUT: ${FUSANHE_TEXT_TIMEOUT:-45}
  FUSANHE_MEDIA_API_BASE_URL: ${FUSANHE_MEDIA_API_BASE_URL:-https://tokendance.space/gateway/v1}
  FUSANHE_MEDIA_API_KEY: ${FUSANHE_MEDIA_API_KEY:-}
  FUSANHE_MEDIA_VIDEO_MODEL: ${FUSANHE_MEDIA_VIDEO_MODEL:-minimax-h3-max}
  FUSANHE_MEDIA_IMAGE_MODEL: ${FUSANHE_MEDIA_IMAGE_MODEL:-}
  FUSANHE_MEDIA_ENABLED: ${FUSANHE_MEDIA_ENABLED:-false}
  FUSANHE_MEDIA_MAX_DAILY_JOBS: ${FUSANHE_MEDIA_MAX_DAILY_JOBS:-20}
  FUSANHE_MEDIA_MAX_ACTIVE_JOBS: ${FUSANHE_MEDIA_MAX_ACTIVE_JOBS:-2}

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-espocrm}
      MARIADB_USER: ${DB_USER:-espocrm}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      start_period: 20s
      timeout: 10s
      retries: 5

  espocrm:
    image: espocrm/espocrm:10.0.8-apache
    environment:
      <<: *ai-gateway-environment
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: db
      ESPOCRM_DATABASE_NAME: ${DB_NAME:-espocrm}
      ESPOCRM_DATABASE_USER: ${DB_USER:-espocrm}
      ESPOCRM_DATABASE_PASSWORD: ${DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME:-admin}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL:-http://localhost:8080}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_TIMEOUT: ${AI_TIMEOUT:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      KNOWLEDGE_BASE_PATH: ${KNOWLEDGE_BASE_PATH:-/var/www/html/knowledge}
      FUSANHE_KNOWLEDGE_MAX_BYTES: ${FUSANHE_KNOWLEDGE_MAX_BYTES:-26214400}
      MATERIAL_LIBRARY_PATH: ${MATERIAL_LIBRARY_PATH:-/var/www/html/materials}
      FUSANHE_AUTOMATION_TOKEN: ${FUSANHE_AUTOMATION_TOKEN}
      FUSANHE_AGENT_CREDENTIAL_TTL_DAYS: ${FUSANHE_AGENT_CREDENTIAL_TTL_DAYS:-90}
      FUSANHE_AUTOMATION_LEGACY_UNTIL: ${FUSANHE_AUTOMATION_LEGACY_UNTIL:-}
      FUSANHE_OUTBOUND_PAUSED: ${FUSANHE_OUTBOUND_PAUSED:-true}
      FUSANHE_PUBLIC_WORKSPACE_ENABLED: ${FUSANHE_PUBLIC_WORKSPACE_ENABLED:-false}
      FUSANHE_FEATURE_PRODUCTS: ${FUSANHE_FEATURE_PRODUCTS:-}
      FUSANHE_FEATURE_CERTIFICATES: ${FUSANHE_FEATURE_CERTIFICATES:-}
      FUSANHE_FEATURE_SAMPLES: ${FUSANHE_FEATURE_SAMPLES:-}
      FUSANHE_FEATURE_QUOTES: ${FUSANHE_FEATURE_QUOTES:-}
      FUSANHE_FEATURE_ORDERS: ${FUSANHE_FEATURE_ORDERS:-}
      ALIBABA_BRIDGE_URL: ${ALIBABA_BRIDGE_URL:-https://api.fsh.digital}
      ALIBABA_BRIDGE_TOKEN: ${ALIBABA_BRIDGE_TOKEN:-}
    volumes:
      - espocrm-data:/var/www/html/data
      - ./custom:/var/www/html/custom
      - ./client/custom:/var/www/html/client/custom
      - ./knowledge:/var/www/html/knowledge:ro
      - ./materials:/var/www/html/materials:ro
    ports:
      - "${ESPOCRM_BIND_ADDRESS:-127.0.0.1}:${ESPOCRM_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 60s
      timeout: 20s
      retries: 3

  daemon:
    image: espocrm/espocrm:10.0.8-apache
    environment:
      <<: *ai-gateway-environment
    volumes_from:
      - espocrm
    restart: unless-stopped
    depends_on:
      espocrm:
        condition: service_healthy
    entrypoint: docker-daemon.sh
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 180s
      timeout: 20s
      retries: 3

  websocket:
    image: espocrm/espocrm:10.0.8-apache
    environment:
      ESPOCRM_CONFIG_USE_WEB_SOCKET: "true"
      ESPOCRM_CONFIG_WEB_SOCKET_URL: ${ESPOCRM_WEBSOCKET_URL:-ws://localhost:8081}
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: tcp://*:7777
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: tcp://websocket:7777
    volumes_from:
      - espocrm
    ports:
      - "${ESPOCRM_WEBSOCKET_BIND_ADDRESS:-127.0.0.1}:${ESPOCRM_WEBSOCKET_PORT:-8081}:8080"
    restart: unless-stopped
    depends_on:
      espocrm:
        condition: service_healthy
    entrypoint: docker-websocket.sh
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 180s
      timeout: 20s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    profiles: ["edge"]
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:-gzfusanhesp.com}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      espocrm:
        condition: service_healthy
      websocket:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  espocrm-data:
  caddy-data:
  caddy-config:
