name: fusanhe-crm

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-espocrm}
      MARIADB_USER: ${DB_USER:-espocrm}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      start_period: 20s
      timeout: 10s
      retries: 5

  espocrm:
    image: espocrm/espocrm:10.0.8-apache
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: db
      ESPOCRM_DATABASE_NAME: ${DB_NAME:-espocrm}
      ESPOCRM_DATABASE_USER: ${DB_USER:-espocrm}
      ESPOCRM_DATABASE_PASSWORD: ${DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME:-admin}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL:-http://localhost:8080}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4.1-mini}
      AI_TIMEOUT: ${AI_TIMEOUT:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      KNOWLEDGE_BASE_PATH: ${KNOWLEDGE_BASE_PATH:-/var/www/html/knowledge}
      MATERIAL_LIBRARY_PATH: ${MATERIAL_LIBRARY_PATH:-/var/www/html/materials}
      FUSANHE_AUTOMATION_TOKEN: ${FUSANHE_AUTOMATION_TOKEN}
      FUSANHE_OUTBOUND_PAUSED: ${FUSANHE_OUTBOUND_PAUSED:-true}
      ALIBABA_BRIDGE_URL: ${ALIBABA_BRIDGE_URL:-https://api.fsh.digital}
      ALIBABA_BRIDGE_TOKEN: ${ALIBABA_BRIDGE_TOKEN:-}
    volumes:
      - espocrm-data:/var/www/html/data
      - ./custom:/var/www/html/custom
      - ./client/custom:/var/www/html/client/custom
      - ./knowledge:/var/www/html/knowledge:ro
      - ./materials:/var/www/html/materials:ro
    ports:
      - "${ESPOCRM_PORT:-8080}:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 60s
      timeout: 20s
      retries: 3

  daemon:
    image: espocrm/espocrm:10.0.8-apache
    volumes_from:
      - espocrm
    restart: unless-stopped
    depends_on:
      espocrm:
        condition: service_healthy
    entrypoint: docker-daemon.sh
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 180s
      timeout: 20s
      retries: 3

  websocket:
    image: espocrm/espocrm:10.0.8-apache
    environment:
      ESPOCRM_CONFIG_USE_WEB_SOCKET: "true"
      ESPOCRM_CONFIG_WEB_SOCKET_URL: ${ESPOCRM_WEBSOCKET_URL:-ws://localhost:8081}
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: tcp://*:7777
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: tcp://websocket:7777
    volumes_from:
      - espocrm
    ports:
      - "${ESPOCRM_WEBSOCKET_PORT:-8081}:8080"
    restart: unless-stopped
    depends_on:
      espocrm:
        condition: service_healthy
    entrypoint: docker-websocket.sh
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      start_period: 20s
      interval: 180s
      timeout: 20s
      retries: 3

volumes:
  db-data:
  espocrm-data:
