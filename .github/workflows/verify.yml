name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec-python-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Validate Spec Kit and offline contracts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/006-dual-ai-gateways
        run: |
          make spec-check
          make verify-offline
      - name: Lint custom PHP
        run: find custom -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private AI workflows in isolated EspoCRM
        env:
          ESPOCRM_API_URL: http://localhost:18082/api/v1
          ESPOCRM_ADMIN_USERNAME: admin
          ESPOCRM_ADMIN_PASSWORD: ci-fictional-admin-password-2026
          RUN_DUAL_AI_ACCEPTANCE: '1'
        run: |
          cp .env.test.example .env.test
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.test')
          s=p.read_text().replace('ESPOCRM_ADMIN_PASSWORD=123456','ESPOCRM_ADMIN_PASSWORD=ci-fictional-admin-password-2026').replace('ESPOCRM_PORT=18080','ESPOCRM_PORT=18082').replace('http://localhost:18080','http://localhost:18082')
          p.write_text(s)
          PY
          docker compose -p fusanhe-ui-v1-test --env-file .env.test -f tests/unified-ui-compose.yaml up -d --wait
          docker compose -p fusanhe-ui-v1-test --env-file .env.test -f tests/unified-ui-compose.yaml exec -T espocrm bin/command rebuild
          python3 scripts/bootstrap.py
          python3 -m unittest tests.test_dual_ai_acceptance -v
      - name: Remove isolated acceptance stack
        if: always()
        run: docker compose -p fusanhe-ui-v1-test --env-file .env.test -f tests/unified-ui-compose.yaml down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/custom/ui/package-lock.json
      - name: Install, test and build unified frontend
        run: |
          npm ci --prefix client/custom/ui
          npm test --prefix client/custom/ui
          node --test client/custom/tests/frontend.test.cjs
          npm run build --prefix client/custom/ui
          git diff --exit-code -- client/custom/res/workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Verify synthetic workflows and responsive layouts
        run: |
          (cd client/custom/ui && npx vite --host 127.0.0.1 --port 5176 --strictPort > /tmp/vite.log 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5176/preview.html > /dev/null; then break; fi
            sleep 1
          done
          python tests/unified_ui_browser.py
          python tests/dual_ai_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-ui-synthetic-screenshots
          path: |
            test-results/unified-ui
            test-results/dual-ai
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test, lint and assemble Android
        working-directory: android-client
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
