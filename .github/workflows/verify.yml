name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec-python-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f deploy/gateway-22005/compose.yaml config --quiet
      - name: Validate Spec Kit and offline contracts
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/006-dual-ai-gateways
        run: |
          make spec-check
          make verify-offline
          php tests/php/reply_assistant.php
          python3 -m unittest tests.test_reply_assistant -v
      - name: Verify acquisition, reception, sales, WeChat and website policies offline
        run: |
          for contract in acquisition_routing acquisition_run gateway_recovery_policy gateway_recovery_service morning_report wechat_report_recovery reception_schedule sales_policy scheduled_reception wechat_accounts wechat_agent wechat_api_acl website_policy; do
            php "tests/${contract}_contract.php" "$PWD"
          done
      - name: Lint custom PHP
        run: find custom -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify private AI workflows in isolated EspoCRM
        env:
          ESPOCRM_API_URL: http://localhost:18082/api/v1
          ESPOCRM_ADMIN_USERNAME: admin
          ESPOCRM_ADMIN_PASSWORD: ci-fictional-admin-password-2026
          RUN_DUAL_AI_ACCEPTANCE: '1'
        run: |
          cp .env.test.example .env.test
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env.test')
          s=p.read_text().replace('ESPOCRM_ADMIN_PASSWORD=123456','ESPOCRM_ADMIN_PASSWORD=ci-fictional-admin-password-2026').replace('ESPOCRM_PORT=18080','ESPOCRM_PORT=18082').replace('http://localhost:18080','http://localhost:18082')
          p.write_text(s)
          PY
          docker compose -p fusanhe-ui-v1-test --env-file .env.test -f tests/unified-ui-compose.yaml up -d --wait
          docker compose -p fusanhe-ui-v1-test --env-file .env.test -f tests/unified-ui-compose.yaml exec -T espocrm bin/command rebuild
          python3 scripts/bootstrap.py
          python3 -m unittest tests.test_dual_ai_acceptance -v
          RUN_REPLY_RUNTIME=1 REPLY_TEST_API_URL="$ESPOCRM_API_URL" REPLY_TEST_ADMIN_PASSWORD="$ESPOCRM_ADMIN_PASSWORD" python3 -m unittest tests.test_reply_assistant_runtime -v
          docker compose -p fusanhe-ui-v1-test --env-file .env.test -f tests/unified-ui-compose.yaml cp tests espocrm:/var/www/html/tests
          docker compose -p fusanhe-ui-v1-test --env-file .env.test -f tests/unified-ui-compose.yaml exec -T espocrm sh -c '
            set -e
            for contract in customer_rating card_progress creative_product media_source media_storage_permissions outreach_research message_translation; do
              php "tests/${contract}_contract.php" custom/Espo/Custom/Tools/Fusanhe
            done
          '
      - name: Remove isolated acceptance stack
        if: always()
        run: |
          if [ -f .env.test ]; then
            docker compose -p fusanhe-ui-v1-test --env-file .env.test -f tests/unified-ui-compose.yaml down -v
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/custom/ui/package-lock.json
      - name: Install, test and build unified frontend
        run: |
          npm ci --prefix client/custom/ui
          npm test --prefix client/custom/ui
          node --test client/custom/tests/frontend.test.cjs
          npm run build --prefix client/custom/ui
          (cd client/custom/ui && npx vite build --config vite.sales.config.ts)
          git diff --exit-code -- client/custom/res/workspace client/custom/res/sales
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runtime
        run: |
          pip install playwright
          playwright install --with-deps chromium
          (cd client/custom/ui && npx playwright install --with-deps chromium)
      - name: Verify synthetic workflows and responsive layouts
        run: |
          (cd client/custom/ui && npx vite --host 127.0.0.1 --port 5176 --strictPort > /tmp/vite.log 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5176/preview.html > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser --prefix client/custom/ui
          python tests/unified_ui_browser.py
          python tests/dual_ai_browser.py
          python tests/conversation_profile_browser.py
          python tests/conversation_sort_browser.py
          python tests/message_translation_browser.py
          python tests/product_creative_browser.py
          python tests/product_creative_retry_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-ui-synthetic-screenshots
          path: |
            runtime/reply-assistant/*.png
            test-results/unified-ui
            test-results/dual-ai
            test-results/conversation-profile
            test-results/conversation-sort
            test-results/message-translation
            /tmp/product-creative-desktop.png
            /tmp/product-creative-mobile.png
          if-no-files-found: ignore

  channels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector test dependencies
        run: pip install -e 'mic-client[dev]' requests python-dotenv
      - name: Verify Linux collector composition and read-only login gates
        run: |
          (cd mic-client && python -m pytest tests/unit tests/contract tests/integration -m 'not live and not live_send')
          PYTHONPATH=alibaba-client:mic-client/src python -m pytest tests/test_windows_gateway.py tests/test_outreach_evidence_contract.py alibaba-client/tests

  # Android 1.0.0 remains a historical snapshot. The maintained product
  # surface is the browser CRM; Android is intentionally outside active CI.
